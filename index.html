<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Anniversary ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: #fff;
        }

        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            text-align: center;
            max-width: 400px;
            width: 90%;
            z-index: 10;
            animation: fadeIn 1.5s ease-in-out;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 25px;
            color: #f9f9f9;
        }

        .heart {
            font-size: 50px;
            animation: heartbeat 1.2s infinite;
            margin-bottom: 15px;
        }

        .btn {
            background-color: #ff3366;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 51, 102, 0.4);
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #e6004c;
            transform: scale(1.05);
        }

        /* Animasi Denyut Jantung */
        @keyframes heartbeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.3); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
            60% { transform: scale(1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Efek Latar Belakang Cinta (Floating Hearts) */
        .floating-heart {
            position: absolute;
            bottom: -20px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 20px;
            animation: floatUp 4s linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100vh) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Kartu Ucapan -->
    <div class="card">
        <div class="heart">❤️</div>
        <h1>Happy Anniversary!</h1>
        <p id="message">Terima kasih sudah berjalan sejauh ini bersamaku. Semoga hari-hari kita ke depan selalu dipenuhi kebahagiaan dan cinta. Aku sayang kamu! ✨</p>
        <button class="btn" onclick="showAlert()">Klik untuk Pesan Spesial</button>
    </div>

    <!-- Script Interaktif Sederhana -->
    <script>
        function showAlert() {
            alert("Happy Anniversary sayang! Semoga langgeng terus ya hingga maut memisahkan. 💖");
        }

        // Fungsi otomatis membuat animasi hati melayang di latar belakang
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('floating-heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 5000);
        }

        setInterval(createHeart, 400);
    </script>

</body>
</html>
